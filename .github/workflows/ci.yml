name: SnapSCAD CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test Suite & Slicing Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (OpenSCAD & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad imagemagick xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Automated Test Suite
        run: |
          xvfb-run -a python main.py --test
