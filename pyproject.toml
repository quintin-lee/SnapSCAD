[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snapscad"
version = "2.9.0"
description = "Turn photos into parametric OpenSCAD 3D models in a snap. Visual Reverse Engineering & AI CAD Agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Quintin Lee" }
]
keywords = [
    "openscad", "cad", "reverse-engineering", "3d-printing", "ai",
    "multimodal", "agent", "stl", "3mf", "dxf", "threejs", "gcode", "slicer",
    "step", "freecad", "brep"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.31.0",
    "PyQt6>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/quintin-lee/SnapSCAD"
Repository = "https://github.com/quintin-lee/SnapSCAD"
Issues = "https://github.com/quintin-lee/SnapSCAD/issues"

[project.scripts]
snapscad = "main:main"
snapscad-gui = "gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openscad_agent*"]

[tool.setuptools]
py-modules = ["main", "gui", "test_agent"]
